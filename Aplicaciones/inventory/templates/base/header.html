{% block header %}
<header class="site-header">
    <div class="header-content">
        <a class="brand" href="/" aria-label="Ir al inicio">
            <span class="brand-mark" aria-hidden="true">🐾</span>
            <span class="brand-copy">
                <strong>Vida Animal</strong>
                <small>Clínica veterinaria</small>
            </span>
        </a>

        <nav class="menu" aria-label="Navegación principal">
            <input type="checkbox" id="menu-toggle" class="menu-toggle">
            <label for="menu-toggle" class="menu-button">
                <span aria-hidden="true">☰</span> Menú
            </label>

            <div class="menu-links">
                <a href="/" class="{% if request.path == '/' or request.path == '/home/' %}activo{% endif %}">
                    <span aria-hidden="true">⌂</span> Inicio
                </a>
                <a href="/pets/" class="{% if '/pets/' in request.path %}activo{% endif %}">
                    <span aria-hidden="true">🐾</span> Mascotas
                </a>
                <a href="/citas/" class="{% if '/citas/' in request.path %}activo{% endif %}">
                    <span aria-hidden="true">◷</span> Citas
                </a>
                <a href="/inventario/" class="{% if request.path == '/inventario/' or '/inventario/detalle/' in request.path %}activo{% endif %}">
                    <span aria-hidden="true">▦</span> Catálogo
                </a>
                <a href="/inventario/listado-productos/" class="{% if '/listado-productos/' in request.path %}activo{% endif %}">
                    <span aria-hidden="true">▤</span> Inventario
                </a>
                <a href="/inventario/carrito/listar-facturas/" class="{% if '/inventario/carrito/' in request.path %}activo{% endif %}">
                    <span aria-hidden="true">▧</span> Facturación
                </a>
                <a href="/contacto/" class="{% if '/contacto/' in request.path %}activo{% endif %}">
                    <span aria-hidden="true">✉</span> Contacto
                </a>

                {% if cant_elementos_carrito > 0 %}
                <a class="carrito-link" href="/inventario/carrito/mostrar-carrito/" aria-label="Ver carrito">
                    <span aria-hidden="true">🛒</span>
                    <span class="carrito-contador">{{ cant_elementos_carrito }}</span>
                </a>
                {% endif %}

                <a class="agendar-link" href="{% url 'citas:crear_cita' %}">
                    <span aria-hidden="true">＋</span> Agendar
                </a>
            </div>
        </nav>
    </div>
</header>
{% endblock %}
