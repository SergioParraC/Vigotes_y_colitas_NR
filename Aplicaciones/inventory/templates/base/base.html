<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titlePage }}</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f3fbf7;
            color: #263238;
            text-align: center;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .site-header {
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 0;
            color: #ffffff;
            background: rgba(11, 72, 64, .97);
            border-bottom: 1px solid rgba(255, 255, 255, .1);
            box-shadow: 0 5px 20px rgba(15, 74, 66, .17);
            backdrop-filter: blur(12px);
        }

        .header-content {
            width: min(1280px, 94%);
            min-height: 72px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 22px;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 11px;
            flex-shrink: 0;
            color: #ffffff;
            text-align: left;
            text-decoration: none;
        }

        .brand-mark {
            display: grid;
            width: 43px;
            height: 43px;
            place-items: center;
            background: linear-gradient(145deg, #ffffff, #dff8f2);
            border-radius: 12px;
            box-shadow: 0 5px 14px rgba(0, 0, 0, .13);
            font-size: 22px;
            transform: rotate(-3deg);
        }

        .brand-copy { display: flex; flex-direction: column; line-height: 1.08; }
        .brand-copy strong { color: #ffffff; font-size: 17px; letter-spacing: -.02em; }
        .brand-copy small { margin-top: 4px; color: rgba(255, 255, 255, .68); font-size: 10px; letter-spacing: .09em; text-transform: uppercase; }

        h1 {
            color: #0f5f55;
            font-size: 34px;
        }

        .menu-toggle {
            display: none;
        }

        .menu-button {
            display: none;
            align-items: center;
            gap: 7px;
            padding: 9px 12px;
            color: #ffffff;
            background: rgba(255, 255, 255, .12);
            border: 1px solid rgba(255, 255, 255, .16);
            border-radius: 9px;
            font-size: 13px;
            cursor: pointer;
        }

        .menu { position: relative; flex: 1; }

        .menu-links {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 3px;
        }

        .menu-links a {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 9px 9px;
            color: rgba(255, 255, 255, .78);
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
            text-decoration: none;
            transition: color .15s ease, background .15s ease, transform .15s ease;
        }

        .menu-links a:hover,
        .menu-links a.activo { color: #ffffff; background: rgba(255, 255, 255, .11); }
        .menu-links a:hover { transform: translateY(-1px); }

        .menu-links .agendar-link {
            margin-left: 5px;
            padding-inline: 13px;
            color: #0b5148;
            background: #ffffff;
            box-shadow: 0 4px 12px rgba(0, 0, 0, .11);
        }
        .menu-links .agendar-link:hover { color: #0b5148; background: #e8faf6; }

        .menu-links .carrito-link { position: relative; padding-inline: 10px; font-size: 15px; }
        .carrito-contador {
            position: absolute;
            right: 1px;
            top: 1px;
            display: grid;
            min-width: 15px;
            height: 15px;
            padding: 0 2px;
            place-items: center;
            color: #ffffff;
            background: #e15b5b;
            border: 2px solid #0b5148;
            border-radius: 999px;
            box-sizing: border-box;
            font-size: 8px;
            font-weight: 800;
        }

        .menu-toggle:checked + .menu-button + .menu-links { display: flex; }

        a {
            text-decoration: none;
        }

        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        table {
            margin-left: auto;
            margin-right: auto;
            border-collapse: collapse;
            border: 1px solid #b8ded7;
            background: #ffffff;
            box-shadow: 0 4px 14px rgba(15,95,85,0.08);
        }
        th, td {
            padding: 8px 16px;
            border: 1px solid #b8ded7;
        }
        td {
            font-size: 18px;
        }
        th {
            background-color: #e8f6f2;
            color: #0f5f55;
            font-size: 18px;
        }
        .form-container,
        .form-delete {
            display: flex;
            justify-content: center;
            width: 100%;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-container form {
            background: #ffffff;
            padding: 32px 32px 24px 32px;
            border: 1px solid #b8ded7;
            border-radius: 8px;
            box-shadow: 0 4px 14px rgba(15,95,85,0.08);
            min-width: 350px;
            max-width: 400px;
        }

        .form-delete form {
            background: transparent;
            padding: 0;
            box-shadow: none;
            min-width: auto;
            max-width: none;
            width: auto;
        }
        .search-wrap { 
            width: 100%; 
            padding: 0 24px; 
            box-sizing: border-box; 
        }

        .search-form { 
            display: grid; 
            grid-template-columns: repeat(5, minmax(200px, 1fr)); 
            gap: 12px; 
            width: 100%; 
            max-width: 1200px; 
            margin: 0 auto; 
            background: transparent; 
            box-shadow: none; 
            padding: 0; 
            align-items: end;
        }

        .search-form .f { 
            display: flex; 
            flex-direction: column; 
            gap: 6px; 
        }

        .search-form button { 
            grid-column: 5 / 6; 
            justify-self: stretch;
            align-self: end;
            margin-top: 0;
        }

        input, select, textarea {
            font-size: 17px;
            padding: 8px 12px;
            border-radius: 7px;
            border: 1px solid #b8ded7;
            width: 100%;
            box-sizing: border-box;
        }
        textarea {
            min-height: 60px;
            resize: vertical;
        }
        button {
            padding: 8px 14px;
            border-radius: 7px;
            border: none;
            background-color: #2f9e8f;
            color: white;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(47,158,143,0.28);
        }
        button:hover {
            background-color: #247f73;
        }
        label {
            text-align: left;
            font-size: 18px;
            margin-bottom: 2px;
            color: #0f5f55;
            font-weight: bold;
        }
        img {
            display: block;
            margin: 0 auto 4px auto;
            max-width: 200px;
            border-radius: 8px;
        }

        @media (max-width: 1120px) {
            .header-content { min-height: 66px; }
            .menu { flex: initial; }
            .menu-button { display: inline-flex; }
            .menu-links {
                display: none;
                position: absolute;
                right: 0;
                top: calc(100% + 12px);
                width: min(310px, 86vw);
                padding: 10px;
                flex-direction: column;
                align-items: stretch;
                gap: 3px;
                background: #ffffff;
                border: 1px solid #d7e9e4;
                border-radius: 12px;
                box-shadow: 0 16px 35px rgba(15, 74, 66, .2);
            }
            .menu-links::before {
                content: "";
                position: absolute;
                right: 20px;
                top: -6px;
                width: 12px;
                height: 12px;
                background: #ffffff;
                border-left: 1px solid #d7e9e4;
                border-top: 1px solid #d7e9e4;
                transform: rotate(45deg);
            }
            .menu-links a {
                width: 100%;
                padding: 10px 12px;
                color: #425c56;
                box-sizing: border-box;
                font-size: 13px;
            }
            .menu-links a:hover,
            .menu-links a.activo { color: #0f5f55; background: #eaf7f4; transform: none; }
            .menu-links .agendar-link {
                margin: 5px 0 0;
                color: #ffffff;
                background: #0f5f55;
            }
            .menu-links .agendar-link:hover { color: #ffffff; background: #247f73; }
            .menu-links .carrito-link { font-size: 13px; }
            .carrito-contador { position: static; margin-left: auto; border: 0; }
        }

        @media (max-width: 800px) {

            .search-form {
                grid-template-columns: 1fr;
            }

            .search-form button {
                grid-column: auto;
            }
        }

        @media (max-width: 480px) {
            .header-content { width: 92%; }
            .brand-mark { width: 39px; height: 39px; font-size: 19px; }
            .brand-copy strong { font-size: 15px; }
            .brand-copy small { font-size: 9px; }
        }
    </style>
</head>
<body>

    {% block header %}
        {% include "base/header.html" %}
    {% endblock %}

    <div style="flex: 1 0 auto; display: flex; flex-direction: column;">
        {% block content %}
        {% endblock %}
    </div>

    <div style="flex-shrink: 0;">
        {% block footer %}
            {% include "base/footer.html" %}
        {% endblock %}
    </div>
</body>
</html>
