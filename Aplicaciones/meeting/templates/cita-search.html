{% extends 'base/base.html' %}

{% block content %}
{% include 'citas-styles.html' %}
<main class="citas-contenedor">
    <section class="citas-hero">
        <h1>Búsqueda avanzada de citas</h1>
        <p>Encuentra una consulta por nombre de mascota, tipo de servicio o estado.</p>
    </section>
    <section class="citas-formulario">
        <form method="get" action="{% url 'citas:filtrar_citas' %}">
            <div class="citas-campo"><label for="nombre">Nombre de la mascota</label><input id="nombre" name="nombre" placeholder="Ej. Luna"></div>
            <div class="citas-grid-2">
                <div class="citas-campo"><label for="tipo">Tipo de servicio</label><select id="tipo" name="tipo"><option value="">Todos</option>{% for valor, texto in tipos %}<option value="{{ valor }}">{{ texto }}</option>{% endfor %}</select></div>
                <div class="citas-campo"><label for="estado">Estado</label><select id="estado" name="estado"><option value="">Todos</option>{% for valor, texto in estados %}<option value="{{ valor }}">{{ texto }}</option>{% endfor %}</select></div>
            </div>
            <div class="citas-acciones"><button class="citas-boton citas-boton--principal" type="submit">Buscar citas</button><a class="citas-boton citas-boton--secundario" href="{% url 'citas:listado_citas' %}">Volver</a></div>
        </form>
    </section>
</main>
{% endblock %}
