{% extends 'base/base.html' %}

{% block content %}

<style>
    .contact-wrap {
        width: 100%;
        max-width: 760px;
        margin: 0 auto;
        padding: 38px 24px;
        box-sizing: border-box;
    }

    .contact {
        background: #ffffff;
        border: 1px solid #b8ded7;
        border-radius: 8px;
        padding: 22px;
        text-align: left;
        box-shadow: 0 4px 14px rgba(15,95,85,0.08);
    }

    .contact h2 {
        margin: 0 0 10px;
        color: #0f5f55;
        font-size: 30px;
    }

    .contact p {
        font-size: 18px;
        line-height: 1.4;
    }

    .contact form p {
        margin: 0 0 14px;
    }

    .contact label {
        display: block;
        margin-bottom: 6px;
        color: #0f5f55;
        font-weight: bold;
    }

    .contact input,
    .contact textarea {
        width: 100%;
        box-sizing: border-box;
    }

    .contact textarea {
        resize: vertical;
    }

    .contact .errorlist {
        color: #b3261e;
        font-size: 16px;
        margin: 4px 0 0;
        padding-left: 18px;
        text-align: left;
    }

    .contact-message {
        color: #0f5f55;
        font-weight: bold;
    }
</style>

<div class="contact-wrap">
    <section class="contact">
        <h2>Contacto</h2>
        <p>Déjanos tus datos y nos comunicaremos contigo.</p>

        {% if mensaje_contacto %}
            <p class="contact-message">{{ mensaje_contacto }}</p>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            {{ formulario_contacto.as_p }}
            <button type="submit">Enviar contacto</button>
        </form>
    </section>
</div>

{% endblock %}
